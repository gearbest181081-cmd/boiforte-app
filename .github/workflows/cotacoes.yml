name: Atualizar cotações

on:
  schedule:
    - cron: '30 21 * * 1-5' # 18h30 em Brasília, depois que o Cepea publica
  workflow_dispatch:

permissions: {}

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar a função de cotações
        env:
          URL: https://uwrrrwzqdptfyxfeazwt.supabase.co
          SEGREDO: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SEGREDO" ]; then echo "CRON_SECRET ainda não configurado: nada a fazer."; exit 0; fi
          curl -fsS -X POST "$URL/functions/v1/atualizar-cotacoes" -H "x-cron-secret: $SEGREDO" -H 'Content-Type: application/json' -d '{}'
