<h2>BoiForte</h2>
<p>Olá! Para confirmar seu e-mail e criar sua senha do BoiForte, abra este e-mail <b>no celular</b> e toque no botão:</p>
<p><a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#2e7d32;color:#fff;padding:14px 24px;border-radius:10px;font-size:18px;font-weight:bold;text-decoration:none">Confirmar e criar minha senha</a></p>
<p>Se o botão não abrir, digite este código no app: <b style="font-size:24px;letter-spacing:4px">{{ .Token }}</b></p>
<p>O link vale por 1 hora. Se não foi você que pediu, ignore este e-mail.</p>
