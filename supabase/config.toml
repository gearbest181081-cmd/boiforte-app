# Configuração do projeto Supabase do BoiForte (usada pelo "supabase link" / "supabase db push" / "functions deploy").
project_id = "boiforte"

[api]
schemas = ["public"]
max_rows = 1000

[auth]
site_url = "https://SEU-USUARIO.github.io/boiforte-app/"
additional_redirect_urls = []
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.rate_limit]
email_sent = 30
sign_in_sign_ups = 30
token_verifications = 30

[auth.email]
enable_signup = true
enable_confirmations = true # obrigatório: sem isto, alguém cria conta com senha usando o e-mail de outra pessoa
otp_length = 6
otp_expiry = 600
max_frequency = "60s"

[auth.email.template.magic_link]
subject = "Seu código do BoiForte"
content_path = "./supabase/templates/codigo.html"

[functions.ler-foto]
verify_jwt = true

[functions.atualizar-cotacoes]
verify_jwt = false
