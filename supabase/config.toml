# Configuração do projeto Supabase do BoiForte (usada pelo "supabase link" / "supabase db push" / "functions deploy").
project_id = "boiforte"

[api]
schemas = ["public"]
max_rows = 1000

[auth]
site_url = "https://SEU-USUARIO.github.io/boiforte-app/"
additional_redirect_urls = []
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
# Senha: pelo menos 8, com letras e números (o servidor recusa senha fraca, não importa o que o app mande).
minimum_password_length = 8
password_requirements = "letters_digits"

[auth.rate_limit]
email_sent = 30
sign_in_sign_ups = 30
token_verifications = 30

[auth.email]
enable_signup = true
enable_confirmations = true # obrigatório: sem isto, alguém cria conta com senha usando o e-mail de outra pessoa
otp_length = 6
otp_expiry = 3600
max_frequency = "60s"
secure_password_change = false # trocar a senha sem link só acontece logo depois de entrar pelo link do e-mail

# Primeiro acesso (conta nova e conta antiga sem senha) e "esqueci a senha": e-mail com link (e código de reserva).
[auth.email.template.confirmation]
subject = "Confirme seu e-mail no BoiForte"
content_path = "./supabase/templates/confirmar.html"

[auth.email.template.magic_link]
subject = "Confirme seu e-mail no BoiForte"
content_path = "./supabase/templates/confirmar.html"

[auth.email.template.recovery]
subject = "Criar senha nova no BoiForte"
content_path = "./supabase/templates/nova-senha.html"

[functions.ler-foto]
verify_jwt = true


# NDVI do satélite: chamada pelo Cron (cabeçalho x-cron-secret) ou pelo app (a função confere o login sozinha).
[functions.ndvi]
verify_jwt = false
